[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "berl-novella-engine"
version = "0.1.0"
description = "A small Python visual novel engine with a Ren'Py-inspired .bne language."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["pygame-ce>=2.5.2,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]
build = ["pyinstaller>=6.10,<7", "pygame-ce==2.5.8"]

[project.scripts]
bne = "bne.__main__:main"

[tool.setuptools.packages.find]
include = ["bne*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
